pWiki`,description:`Public repository documentation and Q&A`,tools:[`deepwiki_read_wiki_structure`,`deepwiki_read_wiki_contents`,`deepwiki_ask_question`],about:`Generated documentation for public GitHub repositories: browse a repository's wiki or ask a question about its code. Answers are generated from the code and can be wrong, so load-bearing claims get checked in the repository itself.`,providers:[{name:`DeepWiki`,url:`https://deepwiki.com`}],billing:`Free. No account or key.`},{id:`polymarket`,label:`Polymarket`,description:`Public prediction-market evidence`,tools:[`polymarket`,`polymarket_history`,`polymarket_resolution`],about:`Prediction-market questions with their current odds, volume and liquidity. Prices show what traders are betting, not what is true.`,providers:[{name:`Polymarket Gamma API`,url:`https://docs.polymarket.com`}],billing:`Free. No account or key.`,logo:`polymarket`},{id:`github`,label:`GitHub`,description:`Discover, compare and read public repositories`,tools:[`github_search`,`github_inspect`,`github_read`],env:[`GH_TOKEN`,`GITHUB_TOKEN`],keys:[[`GH_TOKEN`,`GITHUB_TOKEN`]],credential:`GH_TOKEN or GITHUB_TOKEN, or an existing gh login`,about:`Finds, compares and reads public repositories: repository search, a repository's activity over a window (stars, commits, releases, contributors, review and issue samples) and single files at an exact commit.`,providers:[{name:`GitHub REST and GraphQL APIs`,url:`https://docs.github.com/en/rest`}],billing:`Free. Works without a login at GitHub's lower anonymous limits; a token in keys.env or a gh login raises them and adds review and issue-reply samples.`,logo:`github`},{id:`exa`,label:`Exa`,description:`Web documents, extraction and similarity`,tools:[`exa_search`,`exa_contents`,`exa_similar`,`exa_research`],env:[`EXA_API_KEY`],keys:[`EXA_API_KEY`],credential:`EXA_API_KEY`,about:`Web search that returns ranked pages with their text, plus clean extraction of pages you name and discovery of similar pages. Exa's deep research runs only when explicitly asked for.`,providers:[{name:`Exa`,url:`https://exa.ai`}],billing:`Paid per request in US dollars from your Exa account. Dig records the cost Exa reports.`,logo:`exa`},{id:`perplexity`,label:`Perplexity`,description:`Web search and grounded answers`,tools:[`perplexity_ask`,`perplexity_search`,`perplexity_research`,`perplexity_reason`],env:[`PERPLEXITY_API_KEY`,`PERPLEXITY_TIMEOUT_MS`],keys:[`PERPLEXITY_API_KEY`],credential:`PERPLEXITY_API_KEY`,about:`Web answers with citations at three depths (a quick answer, a reasoned comparison, multi-step research), plus plain search results without an AI answer.`,providers:[{name:`Perplexity API`,url:`https://docs.perplexity.ai`}],billing:`Paid per request in US dollars from your Perplexity API account. Dig records the cost Perplexity reports.`,logo:`perplexity`},{id:`papers`,label:`Papers`,description:`Literature search, full text and optional federated bridge`,tools:[`papers_semantic_scholar_search`,`papers_semantic_scholar_recommendations`,`papers_semantic_scholar_snippets`,`papers_semantic_scholar_relations`,`papers_openalex_search`,`papers_openalex_content`,`papers_multi_search`,`papers_sections`,`papers_fulltext_read`,`papers_pdf_download`],env:[`SEMANTIC_SCHOLAR_API_KEY`,`OPENALEX_API_KEY`,`NCBI_API_KEY`,`PAPER_SEARCH_MCP_NCBI_API_KEY`,`PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY`,`PAPER_SEARCH_MCP_OPENALEX_API_KEY`,`PAPER_SEARCH_MCP_CORE_API_KEY`,`PAPER_SEARCH_MCP_UNPAYWALL_EMAIL`],credential:`Optional provider keys; federated search/full text needs the papers bridge`,envSettings:[{name:`PAPER_SEARCH_MCP_UNPAYWALL_EMAIL`,label:`Unpaywall contact email`,purpose:`Unpaywall looks up a legal free copy of a paper by its DOI, as one of the Papers bridge's federated search sources, and asks for a contact email. Without one, the bridge skips Unpaywall.`}],requires:[`uv (optional bridge)`],about:`Scholarly literature. Semantic Scholar and OpenAlex search and related-paper recommendations work directly. The optional local Papers bridge adds federated search across many indexes (arXiv, PubMed, Crossref and others), open-access full text and PDF downloads.`,providers:[{name:`Semantic Scholar`,url:`https://www.semanticscholar.org/product/api`},{name:`OpenAlex`,url:`https://openalex.org`},{name:`paper-search-mcp bridge`,url:`https://github.com/openags/paper-search-mcp`}],billing:`Mostly free. OpenAlex reports a US-dollar usage cost that its free daily allowance can cover; optional keys raise providers' rate limits.`},{id:`youtube`,label:`YouTube`,description:`Video discovery, saved transcripts and focused Gemini video analysis`,tools:[`youtube`,`youtube_transcript`,`youtube_analyze`,`youtube_analysis_status`],skills:[`youtube`,`youtube-video`],helpers:[`youtube-summarizer`],env:[`OPENCODE_RESEARCH_GOOGLE_API_KEY`,`SCRAPECREATORS_API_KEY`,`GEMINI_API_KEY`],credential:`Optional OPENCODE_RESEARCH_GOOGLE_API_KEY for metadata search; yt-dlp for keyless search and local captions; optional SCRAPECREATORS_API_KEY for hosted transcripts; optional GEMINI_API_KEY for Gemini video analysis`,requires:[`yt-dlp`],about:`Finds videos, saves transcripts and analyzes supplied public YouTube videos. The transcript method searches and checks creator claims; the optional YouTube video method uses Gemini 3.8 Flash for standard deeper analysis and Gemini 4 Argon for harder reasoning. Choose a focused Glimpse inspection when the question calls for close visual examination. Model descriptions and timestamps remain claims to check against the original video.`,providers:[{name:`yt-dlp`,url:`https://github.com/yt-dlp/yt-dlp`},{name:`YouTube Data API`,url:`https://developers.google.com/youtube/v3`},{name:`Google Gemini API`,url:`https://ai.google.dev/gemini-api/docs/video-understanding`}],billing:`Local yt-dlp and YouTube Data API calls are free. Hosted transcripts use reported ScrapeCreators credits. Gemini calls use your Google API account; returned token usage does not establish a per-call charge, so Dig records their cost as unknown.`,logo:`youtube`},{id:`video`,kind:`tool`,label:`Video analysis`,description:`Inspect a supplied video or bounded clip with Elorian Glimpse, directly or alongside source research`,tools:[`video_analyze`],skills:[],helperSkill:`video-analyze`,env:[`ELORIAN_API_KEY`],keys:[`ELORIAN_API_KEY`],credential:`ELORIAN_API_KEY from Elorian's API Keys page`,about:`Answers a focused visual question about a supplied video or bounded clip through Elorian Glimpse. Call it directly from the conversation, or use it to inspect media found during appropriate source research; no dig or report is required. For broader YouTube analysis, start with the YouTube method's Gemini 3.8 Flash and use Argon for harder reasoning. Glimpse remains available for a specific visual need or the user's explicit choice. Media is sent to Elorian, and its answer is model-generated analysis to check against the original.`,providers:[{name:`Elorian`,url:`https://platform.elorian.ai/settings/docs`}],billing:`Paid from your Elorian account. Token usage is shown when returned; the API does not report a per-call charge, so Dig records cost as unknown.`},{id:`evidence`,kind:`tool`,label:`Evidence ranking`,description:`Suggest a reading order for supplied excerpts with TypeSafe Jev`,tools:[`evidence_rank`],skills:[],helperSkill:`evidence-rank`,env:[`TYPESAFE_API_KEY`],keys:[`TYPESAFE_API_KEY`],credential:`TYPESAFE_API_KEY from TypeSafe's console; optional and independent of research-source keys`,about:`Sends a caller-selected shortlist of text excerpts to TypeSafe Jev to suggest a reading order. It can also assess how each excerpt relates to a supplied claim. Supporting and contradictory evidence both count as relevant. Every candidate stays available, including unscored entries; the caller decides what to read. Scores and confidence do not establish truth, and ranking does not replace reading relied-on reports and original evidence. Nothing runs automatic
